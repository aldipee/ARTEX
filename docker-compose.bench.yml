# ARTEX Tencent TSec Benchmark evaluation image — local one-command build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in foreground (watch logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also remove volumes)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host network: the container uses the host network stack directly and can reach target machines on the host/VPN network.
    # In host mode there's no port mapping; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and internal PostgreSQL 5432 — make sure these three host ports are free (stop services occupying them before local testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
